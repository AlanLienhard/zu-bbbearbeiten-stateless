<!DOCTYPE html>
<html lang="de" dir="ltr">
<head>
  <meta charset="utf-8">
  <title>Zu Bbbearbeiten</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/semantic-ui@2.4.2/dist/semantic.min.css">
  <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎯</text></svg>">
  <script src="https://cdn.jsdelivr.net/npm/semantic-ui@2.4.2/dist/semantic.min.js" defer></script>
</head>
<body>
  <div class="ui container" style="margin-top: 50px;">
    <h1 class="ui center aligned header">👏👏👏 Aufgabenliste, ToDo (Änderung für HZ3)</h1>
    <div class="ui divider"></div>

   
    <form name="item" class="ui form" action="/add" method="post">
      <div class="field" style="margin-top: 10px;">
        <label for="text" class="ui pointing below label">Was gibbbt es zu tun?</label>
        <div class="ui action input">
         
          <input id="text" autofocus name="text" type="text" placeholder="Fürs Modul lernen..." required>
          <button class="ui blue button" type="submit">Hinzufügen</button>
        </div>
      </div>

      
      <div class="field" style="margin-top: 10px;">
        <label for="due_date" class="ui pointing below label">Bis wann?</label>
        <input id="due_date" name="due_date" type="date">
      </div>
    </form>

   
    {% for item in items %}
      <div class="ui segment" style="overflow:hidden; position: relative">
        <span class="ui header" style="margin-left: 0.5em;">
          {{ item.text }}
          {% if item.due_date %}
            <small class="ui grey tiny text">– fällig am {{ item.due_date }}</small>
          {% endif %}
        </span>

        {% if item.isCompleted %}
          <a class="ui green left corner label" href="/update/{{ loop.index0 }}">
            <i class="check square outline icon"></i>
          </a>
        {% else %}
          <a class="ui red left corner label" href="/update/{{ loop.index0 }}">
            <i class="square outline icon"></i>
          </a>
        {% endif %}
      </div>
    {% endfor %}
  </div>

  
  <script>
    window.addEventListener('DOMContentLoaded', () => {
      const input = document.getElementById('text');
      if (input) input.focus();
    });
  </script>
</body>
</html>
