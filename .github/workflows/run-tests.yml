name: Run Tests
on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main, feat/* ]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true
          pip install pytest black flake8
      - run: pytest -q
